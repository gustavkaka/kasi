<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lyric Collection</title>

  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    /* 全体の基本設定（高級ダークモード） */
    :root {
      --lyric-font-size: 1rem;
      --bg-color: #09090a;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --chip-bg: rgba(255, 255, 255, 0.06);
      --chip-hover: rgba(255, 255, 255, 0.12);
      --text-main: #f2f2f7;
      --text-sub: #98989d;
      --accent: #0a84ff;
      --accent-badge: rgba(10, 132, 255, 0.18);
      --danger: #ff453a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 0;
    }

    /* スマホ画面風コンテナ */
    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--card-border);
      border-right: 1px solid var(--card-border);
      position: relative;
      padding-bottom: 70px;
    }

    /* ヘッダー */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(9, 9, 10, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-right {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.1);
    }

    /* ページエリア */
    .page {
      display: none;
      padding: 12px 10px;
      flex-direction: column;
      gap: 12px;
    }

    .page.active {
      display: flex;
    }

    /* 検索バー */
    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.9rem;
      width: 100%;
    }

    .search-box input::placeholder {
      color: var(--text-sub);
    }

    /* 空の状態（Empty State） */
    .empty-state {
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: var(--text-sub);
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .empty-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .empty-desc {
      font-size: 0.85rem;
      line-height: 1.4;
    }

    /* 歌詞カードリスト */
    .lyric-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lyric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 11px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .lyric-card:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.07);
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-game-brand {
      font-size: 0.72rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-badge {
      background: var(--accent-badge);
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .card-song-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
    }

    .card-artist {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .card-preview {
      font-size: 0.76rem;
      color: rgba(242, 242, 247, 0.45);
      line-height: 1.35;
      margin-top: 2px;
      white-space: pre-line;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* フォーム入力形式 */
    .form-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }

    .form-input, .form-select {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text-main);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s ease;
      width: 100%;
    }

    .form-select option {
      background: #1c1c1e;
      color: var(--text-main);
    }

    .form-input:focus, .form-select:focus {
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* 複数動的入力行（歌手入力欄用） */
    .dynamic-input-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dynamic-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action-icon {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-action-icon:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-action-icon.danger {
      color: var(--danger);
    }

    /* 歌詞ブロック関連 */
    .blocks-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lyric-block {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .block-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .delete-block-btn {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 2px 6px;
    }

    .block-textarea {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.88rem;
      line-height: 1.4;
      resize: vertical;
      min-height: 75px;
    }

    .add-block-btn {
      background: transparent;
      border: 1px dashed var(--card-border);
      color: var(--text-main);
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease;
    }

    .add-block-btn:active {
      background: rgba(255, 255, 255, 0.05);
    }

    .save-submit-btn {
      background: var(--text-main);
      color: var(--bg-color);
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    .save-submit-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .form-danger-btn {
      background: transparent;
      color: var(--danger);
      border: none;
      padding: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-top: 8px;
      opacity: 0.7;
    }

    /* 閲覧画面（ステージ風デザイン） */
    .detail-hero {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .detail-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-badge-pill {
      background: var(--accent-badge);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    .detail-song-title {
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.3px;
      color: #ffffff;
      margin-top: 2px;
    }

    .detail-chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .meta-chip {
      background: var(--chip-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.75rem;
      color: var(--text-sub);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
    }

    .meta-chip:active {
      transform: scale(0.95);
      background: var(--chip-hover);
      color: var(--text-main);
    }

    .meta-chip svg {
      opacity: 0.6;
    }

    /* 歌詞ステージ */
    .lyrics-stage {
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      /* ブロック同士の間 = ブロック内の改行（line-height 1.85）の1.5倍。歌詞の文字サイズに連動させる */
      gap: calc(var(--lyric-font-size, 1rem) * 1.85 * 1.5);
    }

    .lyric-display-block {
      font-size: var(--lyric-font-size, 1rem);
      line-height: 1.85;
      letter-spacing: 0;
      white-space: pre-line;
      color: #f2f2f7;
      word-break: break-word;
    }

    /* ドロワーメニュー */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-content {
      width: 82%;
      max-width: 360px;
      height: 100%;
      background: #121214;
      border-left: 1px solid var(--card-border);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .drawer-overlay.active .drawer-content {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .drawer-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .category-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .category-sec-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .category-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .category-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .category-tag:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.1);
    }

    .tag-count {
      font-size: 0.7rem;
      color: var(--text-sub);
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 10px;
    }

    /* バックアップエリア */
    .backup-section {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .backup-btn-group {
      display: flex;
      gap: 8px;
    }

    .secondary-btn {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .secondary-btn:active {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    /* 下部ナビゲーションバー */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 64px;
      background: rgba(9, 9, 10, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
    }

    .nav-item {
      background: transparent;
      border: none;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      padding: 8px 0;
      transition: color 0.2s ease;
    }

    .nav-item.active {
      color: var(--text-main);
    }

    .nav-item svg {
      stroke: currentColor;
    }
    /* --- 改良版で追加したUI --- */
    .filter-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--accent-badge); border: 1px solid var(--card-border);
      border-radius: 10px; padding: 8px 12px; font-size: 0.8rem; color: var(--text-main);
    }
    .filter-clear-btn {
      background: transparent; border: none; color: var(--accent);
      font-size: 0.8rem; font-weight: 700; cursor: pointer; white-space: nowrap; padding: 2px 4px;
    }
    .result-meta { font-size: 0.75rem; color: var(--text-sub); padding: 0 4px; }
    .show-more-btn {
      background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main);
      padding: 12px; border-radius: 12px; font-size: 0.88rem; font-weight: 600; cursor: pointer; width: 100%;
    }
    .search-clear-btn {
      background: transparent; border: none; color: var(--text-sub);
      font-size: 1rem; cursor: pointer; padding: 0 2px; line-height: 1; flex-shrink: 0;
    }
    .font-controls {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .font-controls-label { font-size: 0.75rem; font-weight: 600; color: var(--text-sub); margin-right: 2px; }
    .font-btn {
      background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-sub);
      border-radius: 8px; padding: 6px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .font-btn.active { color: var(--text-main); border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.1); }
    .backup-note { font-size: 0.72rem; color: var(--text-sub); line-height: 1.4; }
    .sound-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sound-row-label { font-size: 0.8rem; color: var(--text-sub); font-weight: 600; }
    .sound-toggle-btn { flex: 0 0 auto; min-width: 72px; }
    /* --- アプリ感のための刷新（v2） --- */
    html { overscroll-behavior: none; }
    body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
    header, .bottom-nav, .lyric-card, .category-tag, .meta-chip, button { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .lyrics-stage, .card-preview { -webkit-user-select: text; user-select: text; }
    header { padding-top: calc(14px + env(safe-area-inset-top)); }
    .app-container { padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
    .bottom-nav { height: calc(64px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); }
    .page.active { animation: pageIn 0.22s ease both; }
    @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .lyric-list { gap: 10px; }
    .lyric-card {
      flex-direction: row; align-items: flex-start; gap: 12px;
      border-radius: 16px; padding: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    .card-avatar {
      width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.15rem; font-weight: 800; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .card-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .card-fav {
      background: transparent; border: none; color: var(--text-sub);
      font-size: 1.15rem; cursor: pointer; padding: 2px 4px; line-height: 1; flex-shrink: 0;
    }
    .card-fav.active { color: #ff375f; }
    .card-badge[data-type="ED"], .detail-badge-pill[data-type="ED"] { background: rgba(191,90,242,0.18); color: #bf5af2; }
    .card-badge[data-type="挿入歌"], .detail-badge-pill[data-type="挿入歌"] { background: rgba(48,209,88,0.16); color: #30d158; }
    .card-badge[data-type="キャラソン"], .detail-badge-pill[data-type="キャラソン"] { background: rgba(255,55,95,0.16); color: #ff6482; }
    .card-badge[data-type="イメージソング"], .detail-badge-pill[data-type="イメージソング"] { background: rgba(255,159,10,0.16); color: #ff9f0a; }
    .card-badge[data-type="その他"], .detail-badge-pill[data-type="その他"] { background: rgba(152,152,157,0.18); color: #98989d; }
    .stats-bar {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px;
      padding: 8px 12px; font-size: 0.78rem; color: var(--text-sub); text-align: center; letter-spacing: 0.3px;
    }
    .sort-row { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .sort-btn {
      background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-sub);
      border-radius: 20px; padding: 6px 12px; font-size: 0.78rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .sort-btn.active { color: var(--text-main); background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }
    .sort-btn.fav-active { color: #ff6482; border-color: rgba(255,55,95,0.5); }
    .sort-spacer { flex: 1; }
    .fab {
      position: fixed; right: max(16px, calc(50% - 224px)); bottom: calc(24px + env(safe-area-inset-bottom));
      width: 56px; height: 56px; border-radius: 50%; border: none; z-index: 60;
      background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(10,132,255,0.45); cursor: pointer; transition: transform 0.12s ease;
    }
    .fab:active { transform: scale(0.9); }
    .detail-actions { display: flex; gap: 8px; }
    .fav-btn { font-size: 1.05rem; }
    .fav-btn.fav-active { color: #ff375f; border-color: rgba(255,55,95,0.5); }
    .detail-artwork {
      width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.7rem; font-weight: 800; box-shadow: 0 8px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .toast {
      position: fixed; left: 50%; transform: translateX(-50%) translateY(10px);
      bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 200;
      background: rgba(44,44,46,0.96); color: var(--text-main); border: 1px solid var(--card-border);
      padding: 11px 18px; border-radius: 24px; font-size: 0.85rem; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); white-space: nowrap; max-width: 92vw;
      overflow: hidden; text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .modal-overlay {
      position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.22s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-sheet {
      width: 100%; max-width: 480px; background: #17171a; border-top: 1px solid var(--card-border);
      border-radius: 20px 20px 0 0; padding: 22px 20px calc(20px + env(safe-area-inset-bottom));
      transform: translateY(24px); transition: transform 0.25s cubic-bezier(0.16,1,0.3,1);
      display: flex; flex-direction: column; gap: 18px;
    }
    .modal-overlay.active .modal-sheet { transform: translateY(0); }
    .modal-msg { font-size: 0.92rem; line-height: 1.6; white-space: pre-line; color: var(--text-main); }
    .modal-btns { display: flex; gap: 10px; }
    .modal-btn {
      flex: 1; padding: 13px; border-radius: 14px; border: 1px solid var(--card-border);
      background: var(--card-bg); color: var(--text-main); font-size: 0.9rem; font-weight: 700; cursor: pointer;
    }
    .modal-btn.primary { background: var(--text-main); color: var(--bg-color); border: none; }
    .modal-btn.primary.danger { background: var(--danger); color: #fff; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- ヘッダー -->
    <header>
      <div class="header-left">
        <button id="backBtn" class="icon-btn" style="display: none;" title="戻る" aria-label="戻る">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h1 id="headerTitle" class="app-title">Library</h1>
      </div>
      <div class="header-right">
        <button id="menuBtn" class="icon-btn" title="カテゴリ一覧" aria-label="カテゴリ一覧">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </header>

    <!-- ページ1: 歌詞一覧 -->
    <div id="listPage" class="page active">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#98989d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="曲名・作品名・歌手・ブランド・歌詞で検索...">
        <button type="button" id="searchClearBtn" class="search-clear-btn" style="display: none;" aria-label="検索をクリア">✕</button>
      </div>

      <div id="filterBar" class="filter-bar" style="display: none;">
        <span id="filterBarText"></span>
        <button type="button" id="filterClearBtn" class="filter-clear-btn">✕ 解除</button>
      </div>
      <div id="resultMeta" class="result-meta" style="display: none;"></div>
      <div id="statsBar" class="stats-bar" style="display: none;"></div>
      <div class="sort-row">
        <button type="button" class="sort-btn active" data-sort="new">新着順</button>
        <button type="button" class="sort-btn" data-sort="title">曲名順</button>
        <button type="button" class="sort-btn" data-sort="artist">歌手順</button>
        <span class="sort-spacer"></span>
        <button type="button" id="favFilterBtn" class="sort-btn">♡ お気に入り</button>
      </div>

      <div id="emptyState" class="empty-state">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <div class="empty-title">歌詞がまだありません</div>
        <div class="empty-desc">下の「追加」タブから<br>お気に入りの楽曲を登録しましょう。</div>
      </div>

      <div id="lyricList" class="lyric-list"></div>
    </div>

    <!-- ページ2: 歌詞追加／編集 -->
    <div id="addPage" class="page">
      <form id="lyricForm" class="form-section">
        <div class="form-group">
          <label for="songTitle">曲名 *</label>
          <input type="text" id="songTitle" class="form-input" placeholder="例: Phantasmagoria" required>
        </div>

        <div class="form-group">
          <label for="gameTitle">作品名（ゲームタイトル）</label>
          <input type="text" id="gameTitle" class="form-input" placeholder="例: ○○の輪舞曲">
        </div>

        <div class="form-group">
          <label for="brandName">ブランド</label>
          <input type="text" id="brandName" class="form-input" placeholder="例: Navel">
        </div>

        <div class="form-group">
          <label for="songType">種別</label>
          <select id="songType" class="form-select">
            <option value="OP">OP (オープニング)</option>
            <option value="ED">ED (エンディング)</option>
            <option value="挿入歌">挿入歌</option>
            <option value="キャラソン">キャラクターソング</option>
            <option value="イメージソング">イメージソング</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="form-group">
          <label>歌手（アーティスト）</label>
          <div id="artistsContainer" class="dynamic-input-container"></div>
        </div>

        <div class="form-group">
          <label for="lyricist">作詞</label>
          <input type="text" id="lyricist" class="form-input" placeholder="作詞者の名前">
        </div>

        <div class="form-group">
          <label for="composer">作曲</label>
          <input type="text" id="composer" class="form-input" placeholder="作曲者の名前">
        </div>

        <div class="form-group">
          <label for="arranger">編曲</label>
          <input type="text" id="arranger" class="form-input" placeholder="編曲者の名前">
        </div>

        <div class="form-group">
          <label>歌詞ブロック</label>
          <div id="blocksContainer" class="blocks-container">
            <div class="lyric-block">
              <div class="block-header">
                <span class="block-label">ブロック 1</span>
              </div>
              <textarea class="block-textarea" placeholder="歌詞を入力..."></textarea>
            </div>
          </div>
          <button type="button" id="addBlockBtn" class="add-block-btn">
            ＋ ブロックを追加
          </button>
        </div>

        <button type="submit" id="saveSubmitBtn" class="save-submit-btn">歌詞を保存する</button>
        <button type="button" id="formDeleteBtn" class="form-danger-btn" style="display: none;">この歌詞を削除する</button>
      </form>
    </div>

    <!-- ページ3: 歌詞閲覧（ステージ風詳細UI） -->
    <div id="detailPage" class="page">
      <div class="detail-hero">
        <div class="detail-top-bar">
          <span id="detailBadge" class="detail-badge-pill"></span>
          <div class="detail-actions">
          <button id="detailFavBtn" class="icon-btn fav-btn" title="お気に入り" aria-label="お気に入り">♡</button>
          <button id="editBtn" class="icon-btn" title="編集" aria-label="編集">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          </div>
        </div>

        <div id="detailArtwork" class="detail-artwork">♪</div>

        <h2 id="detailTitle" class="detail-song-title"></h2>

        <div id="detailChipsRow" class="detail-chips-row"></div>
      </div>

      <div class="font-controls">
        <span class="font-controls-label">文字サイズ</span>
        <button type="button" class="font-btn" data-font-level="small">小</button>
        <button type="button" class="font-btn" data-font-level="normal">標準</button>
        <button type="button" class="font-btn" data-font-level="large">大</button>
        <button type="button" class="font-btn" data-font-level="xlarge">特大</button>
      </div>

      <div id="lyricsStage" class="lyrics-stage"></div>
    </div>

    <!-- ドロワーメニュー -->
    <div id="drawerOverlay" class="drawer-overlay">
      <div class="drawer-content">
        <div class="drawer-header">
          <span class="drawer-title">ライブラリ分類</span>
          <button id="closeDrawerBtn" class="icon-btn" aria-label="閉じる">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="category-section">
          <div class="category-sec-title">歌手（アーティスト）</div>
          <div id="artistTags" class="category-tags"></div>
        </div>

        <div class="category-section">
          <div class="category-sec-title">作品名（ゲーム）</div>
          <div id="gameTags" class="category-tags"></div>
        </div>

        <div class="category-section">
          <div class="category-sec-title">ブランド</div>
          <div id="brandTags" class="category-tags"></div>
        </div>

        <div class="category-section">
          <div class="category-sec-title">種別</div>
          <div id="typeTags" class="category-tags"></div>
        </div>

        <!-- バックアップ・復元エリア -->
        <div class="backup-section">
          <div class="category-sec-title">データ管理</div>
          <div id="lastExportNote" class="backup-note">最終書き出し：未記録</div>
          <div class="backup-btn-group">
            <button id="exportBtn" class="secondary-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              書き出し
            </button>
            <button id="importBtn" class="secondary-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              読み込み
            </button>
            <input type="file" id="importFileInput" accept=".json" style="display: none;">
          </div>
          <div class="sound-row">
            <span class="sound-row-label">起動音</span>
            <button type="button" id="soundToggleBtn" class="secondary-btn sound-toggle-btn">ON</button>
          </div>
        </div>
      </div>
    </div>

    <button id="fabAdd" class="fab" style="display: none;" aria-label="歌詞を追加">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <div id="toast" class="toast"></div>

    <div id="appModal" class="modal-overlay">
      <div class="modal-sheet">
        <div id="modalMsg" class="modal-msg"></div>
        <div class="modal-btns">
          <button type="button" id="modalCancel" class="modal-btn">キャンセル</button>
          <button type="button" id="modalOk" class="modal-btn primary">OK</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let db;
    let currentDetailItem = null;
    let editingId = null;
    let activeFilter = null; // { field: 'artists', value: 'KOTOKO' } 形式の厳密フィルター
    let allLyricsCache = null; // IndexedDBの全件をメモリに保持（検索のたびにDBを読まない）
    const PAGE_SIZE = 100;
    let renderLimit = PAGE_SIZE;
    let searchTimer = null;

    function invalidateLyricsCache() { allLyricsCache = null; }

    function loadAllLyrics() {
      return new Promise((resolve) => {
        if (allLyricsCache) { resolve(allLyricsCache); return; }
        if (!db) { resolve([]); return; }
        const tx = db.transaction('lyrics', 'readonly');
        const req = tx.objectStore('lyrics').getAll();
        req.onsuccess = () => { allLyricsCache = req.result || []; resolve(allLyricsCache); };
        req.onerror = () => resolve([]);
      });
    }

    // 重複判定キー：曲名＋作品名＋歌手（表記ゆれは小文字化して吸収）
    function lyricDedupKey(item) {
      const artists = getArtistsArray(item).map(a => a.trim().toLowerCase()).sort().join('/');
      return [(item.songTitle || '').trim().toLowerCase(), (item.gameTitle || '').trim().toLowerCase(), artists].join('|');
    }

    let sortMode = 'new';
    try { sortMode = localStorage.getItem('lyricSortMode') || 'new'; } catch (e) {}
    let favOnly = false;

    function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) {} }
    function hashHue(str) { let h = 0; const t = String(str || ''); for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) % 360; return h; }

    function showToast(msg) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(showToast._tm);
      showToast._tm = setTimeout(() => t.classList.remove('show'), 2200);
    }

    let modalResolver = null;
    function appConfirm(msg, opts) {
      opts = opts || {};
      return new Promise((resolve) => {
        const ov = document.getElementById('appModal');
        if (!ov) { resolve(confirm(msg)); return; }
        modalResolver = resolve;
        document.getElementById('modalMsg').textContent = msg;
        const ok = document.getElementById('modalOk');
        ok.textContent = opts.okText || 'OK';
        ok.classList.toggle('danger', !!opts.danger);
        const cancel = document.getElementById('modalCancel');
        cancel.style.display = opts.alertOnly ? 'none' : 'block';
        cancel.textContent = opts.cancelText || 'キャンセル';
        ov.classList.add('active');
      });
    }
    function appAlert(msg) { return appConfirm(msg, { alertOnly: true, okText: '閉じる' }); }
    function closeModal(result) {
      const ov = document.getElementById('appModal');
      if (ov) ov.classList.remove('active');
      if (modalResolver) { const r = modalResolver; modalResolver = null; r(result); }
    }

    function updateDetailFavBtn() {
      const b = document.getElementById('detailFavBtn');
      if (!b || !currentDetailItem) return;
      b.classList.toggle('fav-active', !!currentDetailItem.favorite);
      b.textContent = currentDetailItem.favorite ? '♥' : '♡';
    }

    function toggleFavorite(item) {
      if (!db || !item) return;
      item.favorite = !item.favorite;
      const tx = db.transaction('lyrics', 'readwrite');
      tx.objectStore('lyrics').put(item);
      tx.oncomplete = () => {
        buzz(10);
        showToast(item.favorite ? 'お気に入りに追加しました' : 'お気に入りから外しました');
        if (currentDetailItem && currentDetailItem.id === item.id) updateDetailFavBtn();
        renderLyricsList();
      };
    }

    function updateLastExportNote() {
      const el = document.getElementById('lastExportNote');
      if (!el) return;
      const v = localStorage.getItem('lyricLastExportAt');
      el.textContent = v
        ? `最終書き出し：${new Date(Number(v)).toLocaleDateString('ja-JP')}`
        : '最終書き出し：未記録（大切な歌詞なので、書き出しをお忘れなく）';
    }

    const FONT_LEVELS = { small: '0.88rem', normal: '1rem', large: '1.13rem', xlarge: '1.27rem' };
    function applyFontLevel(level) {
      if (!FONT_LEVELS[level]) level = 'normal';
      document.documentElement.style.setProperty('--lyric-font-size', FONT_LEVELS[level]);
      document.querySelectorAll('[data-font-level]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.fontLevel === level);
      });
    }

    const DEFAULT_SEARCH_PLACEHOLDER = "曲名・作品名・歌手・ブランドで検索...";

    // 初期History Stateの準備
    history.replaceState({ page: 'list' }, '');

    const dbReq = indexedDB.open('LyricCollectionDB', 1);

    dbReq.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('lyrics')) {
        db.createObjectStore('lyrics', { keyPath: 'id', autoIncrement: true });
      }
    };

    dbReq.onsuccess = (e) => {
      db = e.target.result;
      renderLyricsList();
    };

    // 下部ナビ廃止に伴い、画面遷移はこの2関数へ集約（FAB／ヘッダータイトルから使う）
    function goToAddPage() {
      resetForm();
      if (history.state?.page !== 'add') {
        history.pushState({ page: 'add' }, '');
      }
      applyPageUI('add');
    }
    function goHomeReset() {
      activeFilter = null;
      favOnly = false;
      const ffb = document.getElementById('favFilterBtn');
      if (ffb) { ffb.classList.remove('fav-active'); ffb.textContent = '♡ お気に入り'; }
      searchInput.value = '';
      searchInput.placeholder = DEFAULT_SEARCH_PLACEHOLDER;
      const scb = document.getElementById('searchClearBtn');
      if (scb) scb.style.display = 'none';
      renderLimit = PAGE_SIZE;
      switchToListPage();
    }
    const listPage = document.getElementById('listPage');
    const addPage = document.getElementById('addPage');
    const detailPage = document.getElementById('detailPage');
    const headerTitle = document.getElementById('headerTitle');
    const backBtn = document.getElementById('backBtn');
    const menuBtn = document.getElementById('menuBtn');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    const searchInput = document.getElementById('searchInput');
    const artistsContainer = document.getElementById('artistsContainer');

    function getFieldLabel(field) {
      switch(field) {
        case 'artists':
        case 'artistName': return '歌手';
        case 'gameTitle': return '作品';
        case 'brandName': return 'ブランド';
        case 'songType': return '種別';
        case 'lyricist': return '作詞';
        case 'composer': return '作曲';
        case 'arranger': return '編曲';
        default: return '絞り込み';
      }
    }

    // アイテムから歌手の配列を安全に取得する互換性ヘルパー
    function getArtistsArray(item) {
      if (Array.isArray(item.artists) && item.artists.length > 0) {
        return item.artists;
      }
      if (item.artistName && item.artistName.trim() !== '') {
        return [item.artistName.trim()];
      }
      return [];
    }

    // 歌手入力欄（動的追加）のレンダリング
    function renderArtistInputs(artistsList = ['']) {
      artistsContainer.innerHTML = '';
      if (artistsList.length === 0) artistsList = [''];

      artistsList.forEach((artistVal, idx) => {
        const row = document.createElement('div');
        row.className = 'dynamic-input-row';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'form-input artist-input';
        input.placeholder = '例: KOTOKO';
        input.value = artistVal;

        row.appendChild(input);

        if (idx === 0) {
          const addBtn = document.createElement('button');
          addBtn.type = 'button';
          addBtn.className = 'btn-action-icon';
          addBtn.title = '歌手を追加';
          addBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
          addBtn.addEventListener('click', () => {
            const currentVals = Array.from(artistsContainer.querySelectorAll('.artist-input')).map(i => i.value);
            currentVals.push('');
            renderArtistInputs(currentVals);
          });
          row.appendChild(addBtn);
        } else {
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'btn-action-icon danger';
          delBtn.title = '削除';
          delBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
          delBtn.addEventListener('click', () => {
            row.remove();
          });
          row.appendChild(delBtn);
        }

        artistsContainer.appendChild(row);
      });
    }

    function resetForm() {
      editingId = null;
      document.getElementById('lyricForm').reset();
      renderArtistInputs(['']);
      blocksContainer.innerHTML = `
        <div class="lyric-block">
          <div class="block-header"><span class="block-label">ブロック 1</span></div>
          <textarea class="block-textarea" placeholder="歌詞を入力..."></textarea>
        </div>
      `;
      updateBlockLabels();
      document.getElementById('saveSubmitBtn').textContent = '歌詞を保存する';
      document.getElementById('formDeleteBtn').style.display = 'none';
    }

    // 初期実行
    renderArtistInputs(['']);

    // 画面切り替え（表示制御のみ）
    function applyPageUI(pageName) {
      window.scrollTo(0, 0);
      const fabEl = document.getElementById('fabAdd');
      if (fabEl) fabEl.style.display = pageName === 'list' ? 'flex' : 'none';

      if (pageName === 'list') {
        listPage.classList.add('active');
        addPage.classList.remove('active');
        detailPage.classList.remove('active');
        backBtn.style.display = 'none';
        headerTitle.textContent = 'Library';
        renderLyricsList();
      } else if (pageName === 'add') {
        addPage.classList.add('active');
        listPage.classList.remove('active');
        detailPage.classList.remove('active');
        backBtn.style.display = 'flex';
        headerTitle.textContent = 'New Song';
      } else if (pageName === 'edit') {
        detailPage.classList.remove('active');
        addPage.classList.add('active');
        listPage.classList.remove('active');
        backBtn.style.display = 'flex';
        headerTitle.textContent = 'Edit Song';
      } else if (pageName === 'detail') {
        listPage.classList.remove('active');
        addPage.classList.remove('active');
        detailPage.classList.add('active');
        backBtn.style.display = 'flex';
        headerTitle.textContent = 'Lyrics';
      }
    }

    function switchToListPage(pushHistory = true) {
      if (pushHistory && history.state?.page !== 'list') {
        history.pushState({ page: 'list' }, '');
      }
      applyPageUI('list');
    }

    // タグ/チップからの厳密絞り込み（完全一致）
    function filterByExactTag(field, value) {
      activeFilter = { field, value };
      renderLimit = PAGE_SIZE;
      searchInput.value = '';
      searchInput.placeholder = `[${getFieldLabel(field)}: ${value}] で絞り込み中...`;
      switchToListPage();
    }

    // ヘッダーのタイトルをタップ = ホーム（検索・絞り込みをリセットして一覧へ）
    headerTitle.style.cursor = 'pointer';
    headerTitle.title = '一覧へ戻る';
    headerTitle.addEventListener('click', () => { goHomeReset(); });

    backBtn.addEventListener('click', () => {
      history.back();
    });

    window.addEventListener('popstate', (e) => {
      const state = e.state;
      if (!state || state.page === 'list') {
        applyPageUI('list');
      } else if (state.page === 'add') {
        applyPageUI('add');
      } else if (state.page === 'detail' && state.item) {
        openDetailPage(state.item, false);
      } else if (state.page === 'edit') {
        applyPageUI('edit');
      }
    });

    menuBtn.addEventListener('click', () => {
      buildCategoryDrawer();
      drawerOverlay.classList.add('active');
    });

    closeDrawerBtn.addEventListener('click', () => {
      drawerOverlay.classList.remove('active');
    });

    drawerOverlay.addEventListener('click', (e) => {
      if (e.target === drawerOverlay) {
        drawerOverlay.classList.remove('active');
      }
    });

    const blocksContainer = document.getElementById('blocksContainer');

    // 歌詞ブロックを安全に作る（歌詞本文は value で入れるので HTML として解釈されない）
    function createLyricBlockElement(text = '') {
      const blockDiv = document.createElement('div');
      blockDiv.className = 'lyric-block';
      const header = document.createElement('div');
      header.className = 'block-header';
      const label = document.createElement('span');
      label.className = 'block-label';
      header.appendChild(label);
      const ta = document.createElement('textarea');
      ta.className = 'block-textarea';
      ta.placeholder = '歌詞を入力...';
      ta.value = text;
      blockDiv.appendChild(header);
      blockDiv.appendChild(ta);
      return blockDiv;
    }
    const addBlockBtn = document.getElementById('addBlockBtn');

    function updateBlockLabels() {
      const blocks = blocksContainer.querySelectorAll('.lyric-block');
      blocks.forEach((block, index) => {
        const label = block.querySelector('.block-label');
        label.textContent = `ブロック ${index + 1}`;
        
        let deleteBtn = block.querySelector('.delete-block-btn');
        if (blocks.length > 1) {
          if (!deleteBtn) {
            deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.className = 'delete-block-btn';
            deleteBtn.textContent = '削除';
            deleteBtn.addEventListener('click', () => {
              block.remove();
              updateBlockLabels();
            });
            block.querySelector('.block-header').appendChild(deleteBtn);
          }
        } else if (deleteBtn) {
          deleteBtn.remove();
        }
      });
    }

    addBlockBtn.addEventListener('click', () => {
      const blockDiv = document.createElement('div');
      blockDiv.className = 'lyric-block';
      blockDiv.innerHTML = `
        <div class="block-header">
          <span class="block-label"></span>
        </div>
        <textarea class="block-textarea" placeholder="歌詞を入力..."></textarea>
      `;
      blocksContainer.appendChild(blockDiv);
      updateBlockLabels();
    });

    updateBlockLabels();

    const lyricForm = document.getElementById('lyricForm');

    lyricForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const songTitle = document.getElementById('songTitle').value.trim();
      const gameTitle = document.getElementById('gameTitle').value.trim();
      const brandName = document.getElementById('brandName').value.trim();
      const songType = document.getElementById('songType').value;
      const lyricist = document.getElementById('lyricist').value.trim();
      const composer = document.getElementById('composer').value.trim();
      const arranger = document.getElementById('arranger').value.trim();

      const artistInputs = artistsContainer.querySelectorAll('.artist-input');
      const artists = Array.from(artistInputs).map(inp => inp.value.trim()).filter(val => val.length > 0);

      const textareas = blocksContainer.querySelectorAll('.block-textarea');
      const blocks = Array.from(textareas).map(ta => ta.value.trim()).filter(text => text.length > 0);

      const now = new Date().getTime();
      const lyricData = {
        songTitle, gameTitle, brandName, songType, artists, lyricist, composer, arranger,
        artistName: artists.join(' / '),
        blocks,
        createdAt: editingId ? (currentDetailItem ? currentDetailItem.createdAt : now) : now,
        updatedAt: now
      };
      if (editingId) lyricData.id = editingId;
      if (editingId && currentDetailItem && currentDetailItem.favorite) lyricData.favorite = true;

      // 重複チェック（編集中の自分自身は除く）
      loadAllLyrics().then(async (all) => {
        const key = lyricDedupKey(lyricData);
        const dup = all.find(it => it.id !== editingId && lyricDedupKey(it) === key);
        if (dup) {
          const ok = await appConfirm('同じ曲名・作品名・歌手の歌詞が既に登録されています。\nそれでも保存しますか？', { okText: '保存する' });
          if (!ok) return;
        }
        const wasEditing = !!editingId;
        const tx = db.transaction('lyrics', 'readwrite');
        const store = tx.objectStore('lyrics');
        if (editingId) { store.put(lyricData); } else { store.add(lyricData); }
        tx.oncomplete = () => { invalidateLyricsCache(); resetForm(); switchToListPage(); buzz(14); showToast(wasEditing ? '変更を保存しました' : '歌詞を保存しました'); };
        tx.onerror = () => appAlert('保存に失敗しました。');
      });
    });


    document.getElementById('editBtn').addEventListener('click', () => {
      if (!currentDetailItem) return;

      editingId = currentDetailItem.id;

      document.getElementById('songTitle').value = currentDetailItem.songTitle || '';
      document.getElementById('gameTitle').value = currentDetailItem.gameTitle || '';
      document.getElementById('brandName').value = currentDetailItem.brandName || '';
      document.getElementById('songType').value = currentDetailItem.songType || 'OP';
      document.getElementById('lyricist').value = currentDetailItem.lyricist || '';
      document.getElementById('composer').value = currentDetailItem.composer || '';
      document.getElementById('arranger').value = currentDetailItem.arranger || '';

      const existingArtists = getArtistsArray(currentDetailItem);
      renderArtistInputs(existingArtists.length > 0 ? existingArtists : ['']);

      blocksContainer.innerHTML = '';
      if (currentDetailItem.blocks && currentDetailItem.blocks.length > 0) {
        currentDetailItem.blocks.forEach(text => {
          blocksContainer.appendChild(createLyricBlockElement(text));
        });
      } else {
        blocksContainer.appendChild(createLyricBlockElement(''));
      }
      updateBlockLabels();

      document.getElementById('saveSubmitBtn').textContent = '変更を保存する';
      document.getElementById('formDeleteBtn').style.display = 'block';

      if (history.state?.page !== 'edit') {
        history.pushState({ page: 'edit' }, '');
      }
      applyPageUI('edit');
    });

    document.getElementById('formDeleteBtn').addEventListener('click', () => {
      if (!editingId || !db) return;

      appConfirm('この歌詞を削除してもよろしいですか？', { okText: '削除する', danger: true }).then((ok) => {
        if (!ok) return;
        const tx = db.transaction('lyrics', 'readwrite');
        const store = tx.objectStore('lyrics');
        store.delete(editingId);
        tx.oncomplete = () => {
          invalidateLyricsCache();
          resetForm();
          switchToListPage();
          showToast('削除しました');
        };
      });
    });


    const lyricList = document.getElementById('lyricList');
    const emptyState = document.getElementById('emptyState');

    function renderLyricsList() {
      if (!db) return;
      if (allLyricsCache) { renderLyricsFromCache(); return; }
      loadAllLyrics().then(() => renderLyricsFromCache());
    }

    function renderLyricsFromCache() {
      let lyrics = [...(allLyricsCache || [])];
      if (sortMode === 'title') {
        lyrics.sort((a, b) => (a.songTitle || '').localeCompare(b.songTitle || '', 'ja'));
      } else if (sortMode === 'artist') {
        lyrics.sort((a, b) => (getArtistsArray(a)[0] || '').localeCompare(getArtistsArray(b)[0] || '', 'ja') || (a.songTitle || '').localeCompare(b.songTitle || '', 'ja'));
      } else {
        lyrics.sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
      }
      const query = searchInput.value.trim();

      if (activeFilter) {
        const targetVal = activeFilter.value.toLowerCase();
        lyrics = lyrics.filter(item => {
          if (activeFilter.field === 'artists' || activeFilter.field === 'artistName') {
            return getArtistsArray(item).some(a => a.toLowerCase() === targetVal);
          }
          return (item[activeFilter.field] || '').toLowerCase() === targetVal;
        });
      } else if (query !== '') {
        const q = query.toLowerCase();
        lyrics = lyrics.filter(item => {
          const artistMatch = getArtistsArray(item).some(a => a.toLowerCase().includes(q));
          return artistMatch ||
            (item.songTitle || '').toLowerCase().includes(q) ||
            (item.gameTitle || '').toLowerCase().includes(q) ||
            (item.brandName || '').toLowerCase().includes(q) ||
            (item.songType || '').toLowerCase().includes(q) ||
            (item.lyricist || '').toLowerCase().includes(q) ||
            (item.composer || '').toLowerCase().includes(q) ||
            (item.arranger || '').toLowerCase().includes(q) ||
            (item.blocks || []).join('\n').toLowerCase().includes(q);
        });
      }

      if (favOnly) lyrics = lyrics.filter(item => item.favorite);

      const statsBar = document.getElementById('statsBar');
      if (statsBar) {
        const allItems = allLyricsCache || [];
        if (allItems.length > 0) {
          const aSet = new Set(); const gSet = new Set();
          allItems.forEach(it => { getArtistsArray(it).forEach(x => aSet.add(x)); if (it.gameTitle) gSet.add(it.gameTitle); });
          statsBar.style.display = 'block';
          statsBar.textContent = `全${allItems.length}曲 ・ 歌手${aSet.size} ・ 作品${gSet.size}`;
        } else {
          statsBar.style.display = 'none';
        }
      }

      // 絞り込みバーの表示
      const filterBar = document.getElementById('filterBar');
      const filterBarText = document.getElementById('filterBarText');
      if (filterBar && filterBarText) {
        if (activeFilter) {
          filterBar.style.display = 'flex';
          filterBarText.textContent = `${getFieldLabel(activeFilter.field)}： ${activeFilter.value} で絞り込み中`;
        } else {
          filterBar.style.display = 'none';
        }
      }

      const totalMatched = lyrics.length;
      const resultMeta = document.getElementById('resultMeta');
      if (resultMeta) {
        resultMeta.style.display = 'block';
        resultMeta.textContent = (activeFilter || query) ? `${totalMatched}件が見つかりました` : `全${totalMatched}件`;
      }

      lyricList.innerHTML = '';
      const emptyTitle = emptyState.querySelector('.empty-title');
      const emptyDesc = emptyState.querySelector('.empty-desc');

      if (totalMatched === 0) {
        emptyState.style.display = 'flex';
        lyricList.style.display = 'none';
        if (favOnly && !activeFilter && !query) {
          if (emptyTitle) emptyTitle.textContent = 'お気に入りはまだありません';
          if (emptyDesc) emptyDesc.textContent = 'カードの ♡ から追加できます。';
        } else if (activeFilter || query) {
          if (emptyTitle) emptyTitle.textContent = '見つかりませんでした';
          if (emptyDesc) emptyDesc.textContent = '検索や絞り込みの条件を変えてみてください。';
        } else {
          if (emptyTitle) emptyTitle.textContent = '歌詞がまだありません';
          if (emptyDesc) emptyDesc.innerHTML = '下の「追加」タブから<br>お気に入りの楽曲を登録しましょう。';
        }
        return;
      }

      emptyState.style.display = 'none';
      lyricList.style.display = 'flex';

      const visible = lyrics.slice(0, renderLimit);
      visible.forEach(item => {
        const card = document.createElement('div');
        card.className = 'lyric-card';

        const hue = hashHue((item.songTitle || '') + (item.gameTitle || ''));
        const avatar = document.createElement('div');
        avatar.className = 'card-avatar';
        avatar.style.background = `linear-gradient(135deg, hsl(${hue} 70% 45%), hsl(${(hue + 40) % 360} 70% 30%))`;
        avatar.textContent = (item.songTitle || '♪').trim().charAt(0) || '♪';

        const content = document.createElement('div');
        content.className = 'card-content';

        let metaText = item.gameTitle;
        if (item.brandName) metaText = metaText ? `${metaText} (${item.brandName})` : item.brandName;

        const metaRow = document.createElement('div');
        metaRow.className = 'card-meta';
        const gameSpan = document.createElement('span');
        gameSpan.className = 'card-game-brand';
        gameSpan.textContent = metaText || '作品名未設定';
        const badgeSpan = document.createElement('span');
        badgeSpan.className = 'card-badge';
        badgeSpan.dataset.type = item.songType || '';
        badgeSpan.textContent = item.songType || '';
        metaRow.appendChild(gameSpan);
        metaRow.appendChild(badgeSpan);

        const titleDiv = document.createElement('div');
        titleDiv.className = 'card-song-title';
        titleDiv.textContent = item.songTitle || '';

        const artistDiv = document.createElement('div');
        artistDiv.className = 'card-artist';
        const itemArtists = getArtistsArray(item);
        artistDiv.textContent = itemArtists.length > 0 ? itemArtists.join(' / ') : '歌手未設定';

        content.appendChild(metaRow);
        content.appendChild(titleDiv);
        content.appendChild(artistDiv);

        const previewText = item.blocks && item.blocks.length > 0 ? item.blocks[0] : '';
        if (previewText) {
          const previewDiv = document.createElement('div');
          previewDiv.className = 'card-preview';
          previewDiv.textContent = previewText;
          content.appendChild(previewDiv);
        }

        const favBtn = document.createElement('button');
        favBtn.type = 'button';
        favBtn.className = 'card-fav' + (item.favorite ? ' active' : '');
        favBtn.textContent = item.favorite ? '♥' : '♡';
        favBtn.setAttribute('aria-label', 'お気に入り');
        favBtn.addEventListener('click', (ev) => { ev.stopPropagation(); toggleFavorite(item); });

        card.appendChild(avatar);
        card.appendChild(content);
        card.appendChild(favBtn);

        card.addEventListener('click', () => { openDetailPage(item, true); });

        lyricList.appendChild(card);
      });

      if (totalMatched > visible.length) {
        const moreBtn = document.createElement('button');
        moreBtn.type = 'button';
        moreBtn.className = 'show-more-btn';
        moreBtn.textContent = `もっと見る（残り ${totalMatched - visible.length} 件）`;
        moreBtn.addEventListener('click', () => { renderLimit += PAGE_SIZE; renderLyricsFromCache(); });
        lyricList.appendChild(moreBtn);
      }
    }

    function openDetailPage(item, pushHistory = true) {
      currentDetailItem = item;

      const badgeEl = document.getElementById('detailBadge');
      badgeEl.textContent = item.songType;
      badgeEl.dataset.type = item.songType || '';
      const artEl = document.getElementById('detailArtwork');
      if (artEl) {
        const hueD = hashHue((item.songTitle || '') + (item.gameTitle || ''));
        artEl.style.background = `linear-gradient(135deg, hsl(${hueD} 70% 45%), hsl(${(hueD + 40) % 360} 70% 30%))`;
        artEl.textContent = (item.songTitle || '♪').trim().charAt(0) || '♪';
      }
      updateDetailFavBtn();
      document.getElementById('detailTitle').textContent = item.songTitle;

      const chipsRow = document.getElementById('detailChipsRow');
      chipsRow.innerHTML = '';

      // 複数歌手をそれぞれ個別チップとして追加
      const itemArtists = getArtistsArray(item);
      itemArtists.forEach(artist => {
        const chip = createChip(artist, 'artists', '歌手', `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        `);
        chipsRow.appendChild(chip);
      });

      if (item.gameTitle) {
        const chip = createChip(item.gameTitle, 'gameTitle', '作品', `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4"/><path d="M8 10v4"/><circle cx="15" cy="11" r="1"/><circle cx="18" cy="13" r="1"/></svg>
        `);
        chipsRow.appendChild(chip);
      }

      if (item.brandName) {
        const chip = createChip(item.brandName, 'brandName', 'ブランド', `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        `);
        chipsRow.appendChild(chip);
      }

      const creditDefs = [
        ['lyricist', '作詞'], ['composer', '作曲'], ['arranger', '編曲']
      ];
      creditDefs.forEach(([field, label]) => {
        const val = (item[field] || '').trim();
        if (!val) return;
        const chip = createChip(val, field, label, `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`);
        chipsRow.appendChild(chip);
      });

      const lyricsStage = document.getElementById('lyricsStage');
      lyricsStage.innerHTML = '';

      if (item.blocks && item.blocks.length > 0) {
        item.blocks.forEach(blockText => {
          const p = document.createElement('div');
          p.className = 'lyric-display-block';
          p.textContent = blockText;
          lyricsStage.appendChild(p);
        });
      }

      if (pushHistory) {
        history.pushState({ page: 'detail', item: item }, '');
      }

      applyPageUI('detail');
    }

    function createChip(text, fieldName, categoryLabel, iconSvg) {
      const chip = document.createElement('div');
      chip.className = 'meta-chip';
      chip.innerHTML = iconSvg;
      const span = document.createElement('span');
      span.textContent = text;
      chip.appendChild(span);
      chip.title = `${categoryLabel}: ${text} で絞り込み`;
      chip.addEventListener('click', () => { filterByExactTag(fieldName, text); });
      return chip;
    }

    function buildCategoryDrawer() {
      if (!db) return;
      updateLastExportNote();
      updateSoundToggleBtn();
      loadAllLyrics().then(lyrics => {
        const artists = {}; const games = {}; const brands = {}; const types = {};
        lyrics.forEach(item => {
          getArtistsArray(item).forEach(a => { if (a) artists[a] = (artists[a] || 0) + 1; });
          if (item.gameTitle) games[item.gameTitle] = (games[item.gameTitle] || 0) + 1;
          if (item.brandName) brands[item.brandName] = (brands[item.brandName] || 0) + 1;
          if (item.songType) types[item.songType] = (types[item.songType] || 0) + 1;
        });
        renderTagGroup('artistTags', 'artists', artists);
        renderTagGroup('gameTags', 'gameTitle', games);
        renderTagGroup('brandTags', 'brandName', brands);
        renderTagGroup('typeTags', 'songType', types);
      });
    }

    function renderTagGroup(containerId, fieldName, dataMap) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      const keys = Object.keys(dataMap).sort((a, b) => dataMap[b] - dataMap[a]);
      if (keys.length === 0) {
        const none = document.createElement('span');
        none.style.cssText = 'font-size:0.75rem; color:var(--text-sub);';
        none.textContent = '登録なし';
        container.appendChild(none);
        return;
      }
      keys.forEach(key => {
        const tag = document.createElement('div');
        tag.className = 'category-tag';
        const nameSpan = document.createElement('span');
        nameSpan.textContent = key;
        const countSpan = document.createElement('span');
        countSpan.className = 'tag-count';
        countSpan.textContent = dataMap[key];
        tag.appendChild(nameSpan);
        tag.appendChild(countSpan);
        tag.addEventListener('click', () => {
          drawerOverlay.classList.remove('active');
          filterByExactTag(fieldName, key);
        });
        container.appendChild(tag);
      });
    }

    // JSON書き出し
    document.getElementById('exportBtn').addEventListener('click', () => {
      if (!db) return;
      const tx = db.transaction('lyrics', 'readonly');
      const store = tx.objectStore('lyrics');
      const req = store.getAll();

      req.onsuccess = () => {
        const dataStr = JSON.stringify(req.result, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `lyric_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        try { localStorage.setItem('lyricLastExportAt', String(Date.now())); } catch (e) {}
        updateLastExportNote();
        URL.revokeObjectURL(url);
      };
    });

    // JSON読み込み
    const importBtn = document.getElementById('importBtn');
    const importFileInput = document.getElementById('importFileInput');

    importBtn.addEventListener('click', () => {
      importFileInput.click();
    });

    importFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file || !db) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        let parsed;
        try { parsed = JSON.parse(event.target.result); }
        catch (err) { appAlert('ファイルの読み込みに失敗しました。JSON形式をご確認ください。'); return; }
        if (!Array.isArray(parsed)) { appAlert('正しいバックアップファイルではありません。'); return; }

        // 検証と正規化（壊れた項目は捨てる／古い形式 artistName にも対応）
        const valid = []; let invalidCount = 0;
        parsed.forEach(raw => {
          if (!raw || typeof raw !== 'object') { invalidCount++; return; }
          const songTitle = typeof raw.songTitle === 'string' ? raw.songTitle.trim() : '';
          if (!songTitle) { invalidCount++; return; }
          let artists = [];
          if (Array.isArray(raw.artists)) artists = raw.artists.filter(a => typeof a === 'string' && a.trim()).map(a => a.trim());
          else if (typeof raw.artistName === 'string' && raw.artistName.trim()) artists = raw.artistName.split('/').map(x => x.trim()).filter(Boolean);
          let blocks = [];
          if (Array.isArray(raw.blocks)) blocks = raw.blocks.filter(b => typeof b === 'string' && b.trim()).map(b => b.trim());
          else if (typeof raw.blocks === 'string' && raw.blocks.trim()) blocks = [raw.blocks.trim()];
          const item = {
            songTitle,
            gameTitle: typeof raw.gameTitle === 'string' ? raw.gameTitle.trim() : '',
            brandName: typeof raw.brandName === 'string' ? raw.brandName.trim() : '',
            songType: typeof raw.songType === 'string' && raw.songType ? raw.songType : 'その他',
            artists,
            artistName: artists.join(' / '),
            lyricist: typeof raw.lyricist === 'string' ? raw.lyricist.trim() : '',
            composer: typeof raw.composer === 'string' ? raw.composer.trim() : '',
            arranger: typeof raw.arranger === 'string' ? raw.arranger.trim() : '',
            blocks,
            createdAt: typeof raw.createdAt === 'number' ? raw.createdAt : Date.now(),
            favorite: raw.favorite === true
          };
          if (typeof raw.updatedAt === 'number') item.updatedAt = raw.updatedAt;
          valid.push(item);
        });

        loadAllLyrics().then(async (existing) => {
          const seen = new Set(existing.map(it => lyricDedupKey(it)));
          const toAdd = []; let dupCount = 0;
          valid.forEach(item => {
            const key = lyricDedupKey(item);
            if (seen.has(key)) { dupCount++; return; }
            seen.add(key); toAdd.push(item);
          });

          if (toAdd.length === 0) {
            appAlert(`追加できる新しい歌詞はありませんでした。\n（重複 ${dupCount} 件／無効 ${invalidCount} 件はスキップ）`);
            return;
          }
          const okImport = await appConfirm(`${toAdd.length} 件の歌詞を追加します。\n（重複 ${dupCount} 件／無効 ${invalidCount} 件はスキップ）\nよろしいですか？`, { okText: '追加する' });
          if (!okImport) return;

          const tx = db.transaction('lyrics', 'readwrite');
          const store = tx.objectStore('lyrics');
          toAdd.forEach(item => store.add(item));
          tx.oncomplete = () => {
            invalidateLyricsCache();
            showToast(`${toAdd.length} 件の歌詞を取り込みました`);
            drawerOverlay.classList.remove('active');
            switchToListPage();
          };
          tx.onerror = () => appAlert('取り込みに失敗しました。');
        });
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    // 検索窓への入力イベント（手入力時はタグ絞り込み解除／少し遅延させて軽くする）
    const searchClearBtn = document.getElementById('searchClearBtn');
    function updateSearchClearBtn() {
      if (searchClearBtn) searchClearBtn.style.display = searchInput.value ? 'block' : 'none';
    }
    searchInput.addEventListener('input', () => {
      if (activeFilter) {
        activeFilter = null;
        searchInput.placeholder = DEFAULT_SEARCH_PLACEHOLDER;
      }
      renderLimit = PAGE_SIZE;
      updateSearchClearBtn();
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderLyricsList, 150);
    });
    if (searchClearBtn) {
      searchClearBtn.addEventListener('click', () => {
        searchInput.value = '';
        updateSearchClearBtn();
        renderLyricsList();
        searchInput.focus();
      });
    }
    const filterClearBtn = document.getElementById('filterClearBtn');
    if (filterClearBtn) {
      filterClearBtn.addEventListener('click', () => {
        activeFilter = null;
        searchInput.placeholder = DEFAULT_SEARCH_PLACEHOLDER;
        renderLimit = PAGE_SIZE;
        renderLyricsList();
      });
    }

    // 文字サイズ切替（詳細画面）
    document.querySelectorAll('[data-font-level]').forEach(btn => {
      btn.addEventListener('click', () => {
        try { localStorage.setItem('lyricFontLevel', btn.dataset.fontLevel); } catch (e) {}
        applyFontLevel(btn.dataset.fontLevel);
      });
    });
    applyFontLevel(localStorage.getItem('lyricFontLevel') || 'normal');

    // モーダルのボタン
    document.getElementById('modalOk').addEventListener('click', () => closeModal(true));
    document.getElementById('modalCancel').addEventListener('click', () => closeModal(false));
    document.getElementById('appModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(false); });

    // ＋ボタン（FAB）
    const fabBtn = document.getElementById('fabAdd');
    if (fabBtn) {
      fabBtn.addEventListener('click', () => { buzz(8); goToAddPage(); });
      fabBtn.style.display = 'flex'; // 起動直後は一覧ページなので表示しておく
    }

    // 並び替え
    document.querySelectorAll('[data-sort]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.sort === sortMode);
      btn.addEventListener('click', () => {
        sortMode = btn.dataset.sort;
        try { localStorage.setItem('lyricSortMode', sortMode); } catch (e) {}
        document.querySelectorAll('[data-sort]').forEach(b => b.classList.toggle('active', b === btn));
        renderLimit = PAGE_SIZE;
        renderLyricsList();
      });
    });

    // お気に入りだけ表示
    const favFilterBtn = document.getElementById('favFilterBtn');
    if (favFilterBtn) {
      favFilterBtn.addEventListener('click', () => {
        favOnly = !favOnly;
        favFilterBtn.classList.toggle('fav-active', favOnly);
        favFilterBtn.textContent = favOnly ? '♥ お気に入り' : '♡ お気に入り';
        renderLimit = PAGE_SIZE;
        renderLyricsList();
      });
    }

    // 詳細画面のお気に入りボタン
    const detailFavBtn = document.getElementById('detailFavBtn');
    if (detailFavBtn) {
      detailFavBtn.addEventListener('click', () => { if (currentDetailItem) toggleFavorite(currentDetailItem); });
    }

    // PWA Service Worker 登録処理
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('ServiceWorker 登録成功:', reg.scope))
          .catch((err) => console.log('ServiceWorker 登録失敗:', err));
      });
    }

    // --- 起動時ランダム効果音再生（ON/OFF切替つき・二重再生防止） ---
    function isStartSoundEnabled() {
      try { return localStorage.getItem('lyricStartSound') !== 'off'; } catch (e) { return true; }
    }
    function updateSoundToggleBtn() {
      const btn = document.getElementById('soundToggleBtn');
      if (btn) btn.textContent = isStartSoundEnabled() ? 'ON' : 'OFF';
    }
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    if (soundToggleBtn) {
      soundToggleBtn.addEventListener('click', () => {
        try { localStorage.setItem('lyricStartSound', isStartSoundEnabled() ? 'off' : 'on'); } catch (e) {}
        updateSoundToggleBtn();
      });
    }
    updateSoundToggleBtn();

    function playRandomStartSound() {
      if (!isStartSoundEnabled()) return;
      const randomNum = Math.floor(Math.random() * 5) + 1;
      const audio = new Audio(`./start${randomNum}.wav`);
      audio.volume = 0.6;
      let played = false;
      const tryPlay = () => {
        if (played) return;
        played = true;
        document.removeEventListener('click', playOnFirstTouch);
        document.removeEventListener('touchstart', playOnFirstTouch);
        audio.play().catch(() => {});
      };
      const playOnFirstTouch = () => tryPlay();
      audio.play().then(() => { played = true; }).catch(() => {
        document.addEventListener('click', playOnFirstTouch);
        document.addEventListener('touchstart', playOnFirstTouch);
      });
    }

    window.addEventListener('DOMContentLoaded', playRandomStartSound);

  </script>

</body>
</html>
