<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyric Collection</title>

  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090a">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    /* 全体の基本設定（高級ダークモード） */
    :root {
      --bg-color: #09090a;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --chip-bg: rgba(255, 255, 255, 0.06);
      --chip-hover: rgba(255, 255, 255, 0.12);
      --text-main: #f2f2f7;
      --text-sub: #98989d;
      --accent: #0a84ff;
      --accent-badge: rgba(10, 132, 255, 0.18);
      --danger: #ff453a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 0;
    }

    /* スマホ画面風コンテナ */
    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--card-border);
      border-right: 1px solid var(--card-border);
      position: relative;
      padding-bottom: 70px;
    }

    /* ヘッダー */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(9, 9, 10, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-right {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.1);
    }

    /* ページエリア（左右余白をスリム化） */
    .page {
      display: none;
      padding: 12px 10px;
      flex-direction: column;
      gap: 12px;
    }

    .page.active {
      display: flex;
    }

    /* 検索バー */
    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.9rem;
      width: 100%;
    }

    .search-box input::placeholder {
      color: var(--text-sub);
    }

    /* 空の状態（Empty State） */
    .empty-state {
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: var(--text-sub);
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .empty-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .empty-desc {
      font-size: 0.85rem;
      line-height: 1.4;
    }

    /* 歌詞カードリスト */
    .lyric-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lyric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 11px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .lyric-card:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.07);
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-game-brand {
      font-size: 0.72rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-badge {
      background: var(--accent-badge);
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .card-song-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
    }

    .card-artist {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .card-preview {
      font-size: 0.76rem;
      color: rgba(242, 242, 247, 0.45);
      line-height: 1.35;
      margin-top: 2px;
      white-space: pre-line;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* フォーム入力形式 */
    .form-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }

    .form-input, .form-select {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text-main);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-select option {
      background: #1c1c1e;
      color: var(--text-main);
    }

    .form-input:focus, .form-select:focus {
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* 歌詞ブロック関連 */
    .blocks-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lyric-block {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .block-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .delete-block-btn {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 2px 6px;
    }

    .block-textarea {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.88rem;
      line-height: 1.4;
      resize: vertical;
      min-height: 75px;
    }

    .add-block-btn {
      background: transparent;
      border: 1px dashed var(--card-border);
      color: var(--text-main);
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease;
    }

    .add-block-btn:active {
      background: rgba(255, 255, 255, 0.05);
    }

    .save-submit-btn {
      background: var(--text-main);
      color: var(--bg-color);
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    .save-submit-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .form-danger-btn {
      background: transparent;
      color: var(--danger);
      border: none;
      padding: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-top: 8px;
      opacity: 0.7;
    }

    /* 閲覧画面（ステージ風デザイン） */
    .detail-hero {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .detail-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-badge-pill {
      background: var(--accent-badge);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    .detail-song-title {
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.3px;
      color: #ffffff;
      margin-top: 2px;
    }

    .detail-chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .meta-chip {
      background: var(--chip-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.75rem;
      color: var(--text-sub);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
    }

    .meta-chip:active {
      transform: scale(0.95);
      background: var(--chip-hover);
      color: var(--text-main);
    }

    .meta-chip svg {
      opacity: 0.6;
    }

    /* 歌詞ステージ（高密度表示化） */
    .lyrics-stage {
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 18px 12px; /* 横幅を最大活用 */
      display: flex;
      flex-direction: column;
      gap: 1.5em; /* ブロック間の比率は保持 */
    }

    .lyric-display-block {
      font-size: 0.76rem; /* 文字を小ぶりにして収容量約1.5倍へ */
      line-height: 1.2;  /* 行間1.2を保持 */
      letter-spacing: 0;  /* 文字間を詰めて勝手な改行を防ぐ */
      white-space: pre-line;
      color: #f2f2f7;
      word-break: break-word;
    }

    /* ドロワーメニュー */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-content {
      width: 82%;
      max-width: 360px;
      height: 100%;
      background: #121214;
      border-left: 1px solid var(--card-border);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .drawer-overlay.active .drawer-content {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .drawer-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .category-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .category-sec-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .category-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .category-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .category-tag:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.1);
    }

    .tag-count {
      font-size: 0.7rem;
      color: var(--text-sub);
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 10px;
    }

    /* バックアップエリア */
    .backup-section {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .backup-btn-group {
      display: flex;
      gap: 8px;
    }

    .secondary-btn {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .secondary-btn:active {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    /* 下部ナビゲーションバー */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 64px;
      background: rgba(9, 9, 10, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
    }

    .nav-item {
      background: transparent;
      border: none;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      padding: 8px 0;
      transition: color 0.2s ease;
    }

    .nav-item.active {
      color: var(--text-main);
    }

    .nav-item svg {
      stroke: currentColor;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- ヘッダー -->
    <header>
      <div class="header-left">
        <button id="backBtn" class="icon-btn" style="display: none;" title="戻る" aria-label="戻る">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h1 id="headerTitle" class="app-title">歌詞ライブラリ</h1>
      </div>
      <div class="header-right">
        <button id="menuBtn" class="icon-btn" title="カテゴリ一覧" aria-label="カテゴリ一覧">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </header>

    <!-- ページ1: 歌詞一覧 -->
    <div id="listPage" class="page active">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#98989d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="曲名・作品名・歌手・ブランドで検索...">
      </div>

      <div id="emptyState" class="empty-state">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <div class="empty-title">歌詞がまだありません</div>
        <div class="empty-desc">下の「追加」タブから<br>お気に入りの楽曲を登録しましょう。</div>
      </div>

      <div id="lyricList" class="lyric-list"></div>
    </div>

    <!-- ページ2: 歌詞追加／編集 -->
    <div id="addPage" class="page">
      <form id="lyricForm" class="form-section">
        <div class="form-group">
          <label for="songTitle">曲名 *</label>
          <input type="text" id="songTitle" class="form-input" placeholder="例: Phantasmagoria" required>
        </div>

        <div class="form-group">
          <label for="gameTitle">作品名（ゲームタイトル）</label>
          <input type="text" id="gameTitle" class="form-input" placeholder="例: ○○の輪舞曲">
        </div>

        <div class="form-group">
          <label for="brandName">ブランド</label>
          <input type="text" id="brandName" class="form-input" placeholder="例: Navel">
        </div>

        <div class="form-group">
          <label for="songType">種別</label>
          <select id="songType" class="form-select">
            <option value="OP">OP (オープニング)</option>
            <option value="ED">ED (エンディング)</option>
            <option value="挿入歌">挿入歌</option>
            <option value="キャラソン">キャラクターソング</option>
            <option value="イメージソング">イメージソング</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="form-group">
          <label for="artistName">歌手（アーティスト）</label>
          <input type="text" id="artistName" class="form-input" placeholder="例: KOTOKO">
        </div>

        <div class="form-group">
          <label>歌詞ブロック</label>
          <div id="blocksContainer" class="blocks-container">
            <div class="lyric-block">
              <div class="block-header">
                <span class="block-label">ブロック 1</span>
              </div>
              <textarea class="block-textarea" placeholder="歌詞を入力..."></textarea>
            </div>
          </div>
          <button type="button" id="addBlockBtn" class="add-block-btn">
            ＋ ブロックを追加
          </button>
        </div>

        <button type="submit" id="saveSubmitBtn" class="save-submit-btn">歌詞を保存する</button>
        <button type="button" id="formDeleteBtn" class="form-danger-btn" style="display: none;">この歌詞を削除する</button>
      </form>
    </div>

    <!-- ページ3: 歌詞閲覧（ステージ風詳細UI） -->
    <div id="detailPage" class="page">
      <div class="detail-hero">
        <div class="detail-top-bar">
          <span id="detailBadge" class="detail-badge-pill"></span>
          <button id="editBtn" class="icon-btn" title="編集" aria-label="編集">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
        </div>

        <h2 id="detailTitle" class="detail-song-title"></h2>

        <div id="detailChipsRow" class="detail-chips-row"></div>
      </div>

      <div id="lyricsStage" class="lyrics-stage"></div>
    </div>

    <!-- ドロワーメニュー -->
    <div id="drawerOverlay" class="drawer-overlay">
      <div class="drawer-content">
        <div class="drawer-header">
          <span class="drawer-title">ライブラリ分類</span>
          <button id="closeDrawerBtn" class="icon-btn" aria-label="閉じる">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="category-section">
          <div class="category-sec-title">歌手（アーティスト）</div>
          <div id="artistTags" class="category-tags"></div>
        </div>

        <div class="category-section">
          <div class="category-sec-title">作品名（ゲーム）</div>
          <div id="gameTags" class="category-tags"></div>
        </div>

        <div class="category-section">
          <div class="category-sec-title">ブランド</div>
          <div id="brandTags" class="category-tags"></div>
        </div>

        <div class="category-section">
          <div class="category-sec-title">種別</div>
          <div id="typeTags" class="category-tags"></div>
        </div>

        <!-- バックアップ・復元エリア -->
        <div class="backup-section">
          <div class="category-sec-title">データ管理</div>
          <div class="backup-btn-group">
            <button id="exportBtn" class="secondary-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              書き出し
            </button>
            <button id="importBtn" class="secondary-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              読み込み
            </button>
            <input type="file" id="importFileInput" accept=".json" style="display: none;">
          </div>
        </div>
      </div>
    </div>

    <!-- 下部ナビゲーション -->
    <nav class="bottom-nav">
      <button id="navListPage" class="nav-item active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        一覧
      </button>
      <button id="navAddPage" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        追加
      </button>
    </nav>
  </div>

  <script>
    let db;
    let currentDetailItem = null;
    let editingId = null;

    const dbReq = indexedDB.open('LyricCollectionDB', 1);

    dbReq.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('lyrics')) {
        db.createObjectStore('lyrics', { keyPath: 'id', autoIncrement: true });
      }
    };

    dbReq.onsuccess = (e) => {
      db = e.target.result;
      renderLyricsList();
    };

    const navListPage = document.getElementById('navListPage');
    const navAddPage = document.getElementById('navAddPage');
    const listPage = document.getElementById('listPage');
    const addPage = document.getElementById('addPage');
    const detailPage = document.getElementById('detailPage');
    const headerTitle = document.getElementById('headerTitle');
    const backBtn = document.getElementById('backBtn');
    const menuBtn = document.getElementById('menuBtn');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    const searchInput = document.getElementById('searchInput');

    function resetForm() {
      editingId = null;
      document.getElementById('lyricForm').reset();
      blocksContainer.innerHTML = `
        <div class="lyric-block">
          <div class="block-header"><span class="block-label">ブロック 1</span></div>
          <textarea class="block-textarea" placeholder="歌詞を入力..."></textarea>
        </div>
      `;
      updateBlockLabels();
      document.getElementById('saveSubmitBtn').textContent = '歌詞を保存する';
      document.getElementById('formDeleteBtn').style.display = 'none';
    }

    function switchToListPage() {
      navListPage.classList.add('active');
      navAddPage.classList.remove('active');
      listPage.classList.add('active');
      addPage.classList.remove('active');
      detailPage.classList.remove('active');
      backBtn.style.display = 'none';
      headerTitle.textContent = '歌詞ライブラリ';
      renderLyricsList(searchInput.value);
    }

    function filterByKeyword(keyword) {
      searchInput.value = keyword;
      switchToListPage();
    }

    navListPage.addEventListener('click', () => {
      searchInput.value = '';
      switchToListPage();
    });

    navAddPage.addEventListener('click', () => {
      resetForm();
      navAddPage.classList.add('active');
      navListPage.classList.remove('active');
      addPage.classList.add('active');
      listPage.classList.remove('active');
      detailPage.classList.remove('active');
      backBtn.style.display = 'none';
      headerTitle.textContent = '歌詞の新規登録';
    });

    backBtn.addEventListener('click', switchToListPage);

    menuBtn.addEventListener('click', () => {
      buildCategoryDrawer();
      drawerOverlay.classList.add('active');
    });

    closeDrawerBtn.addEventListener('click', () => {
      drawerOverlay.classList.remove('active');
    });

    drawerOverlay.addEventListener('click', (e) => {
      if (e.target === drawerOverlay) {
        drawerOverlay.classList.remove('active');
      }
    });

    const blocksContainer = document.getElementById('blocksContainer');
    const addBlockBtn = document.getElementById('addBlockBtn');

    function updateBlockLabels() {
      const blocks = blocksContainer.querySelectorAll('.lyric-block');
      blocks.forEach((block, index) => {
        const label = block.querySelector('.block-label');
        label.textContent = `ブロック ${index + 1}`;
        
        let deleteBtn = block.querySelector('.delete-block-btn');
        if (blocks.length > 1) {
          if (!deleteBtn) {
            deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.className = 'delete-block-btn';
            deleteBtn.textContent = '削除';
            deleteBtn.addEventListener('click', () => {
              block.remove();
              updateBlockLabels();
            });
            block.querySelector('.block-header').appendChild(deleteBtn);
          }
        } else if (deleteBtn) {
          deleteBtn.remove();
        }
      });
    }

    addBlockBtn.addEventListener('click', () => {
      const blockDiv = document.createElement('div');
      blockDiv.className = 'lyric-block';
      blockDiv.innerHTML = `
        <div class="block-header">
          <span class="block-label"></span>
        </div>
        <textarea class="block-textarea" placeholder="歌詞を入力..."></textarea>
      `;
      blocksContainer.appendChild(blockDiv);
      updateBlockLabels();
    });

    updateBlockLabels();

    const lyricForm = document.getElementById('lyricForm');

    lyricForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const songTitle = document.getElementById('songTitle').value.trim();
      const gameTitle = document.getElementById('gameTitle').value.trim();
      const brandName = document.getElementById('brandName').value.trim();
      const songType = document.getElementById('songType').value;
      const artistName = document.getElementById('artistName').value.trim();

      const textareas = blocksContainer.querySelectorAll('.block-textarea');
      const blocks = Array.from(textareas).map(ta => ta.value.trim()).filter(text => text.length > 0);

      const lyricData = {
        songTitle,
        gameTitle,
        brandName,
        songType,
        artistName,
        blocks,
        createdAt: editingId ? (currentDetailItem ? currentDetailItem.createdAt : new Date().getTime()) : new Date().getTime()
      };

      if (editingId) {
        lyricData.id = editingId;
      }

      const tx = db.transaction('lyrics', 'readwrite');
      const store = tx.objectStore('lyrics');
      
      if (editingId) {
        store.put(lyricData);
      } else {
        store.add(lyricData);
      }

      tx.oncomplete = () => {
        resetForm();
        switchToListPage();
      };
    });

    document.getElementById('editBtn').addEventListener('click', () => {
      if (!currentDetailItem) return;

      editingId = currentDetailItem.id;

      document.getElementById('songTitle').value = currentDetailItem.songTitle || '';
      document.getElementById('gameTitle').value = currentDetailItem.gameTitle || '';
      document.getElementById('brandName').value = currentDetailItem.brandName || '';
      document.getElementById('songType').value = currentDetailItem.songType || 'OP';
      document.getElementById('artistName').value = currentDetailItem.artistName || '';

      blocksContainer.innerHTML = '';
      if (currentDetailItem.blocks && currentDetailItem.blocks.length > 0) {
        currentDetailItem.blocks.forEach(text => {
          const blockDiv = document.createElement('div');
          blockDiv.className = 'lyric-block';
          blockDiv.innerHTML = `
            <div class="block-header">
              <span class="block-label"></span>
            </div>
            <textarea class="block-textarea" placeholder="歌詞を入力...">${text}</textarea>
          `;
          blocksContainer.appendChild(blockDiv);
        });
      } else {
        const blockDiv = document.createElement('div');
        blockDiv.className = 'lyric-block';
        blockDiv.innerHTML = `
          <div class="block-header"><span class="block-label"></span></div>
          <textarea class="block-textarea" placeholder="歌詞を入力..."></textarea>
        `;
        blocksContainer.appendChild(blockDiv);
      }
      updateBlockLabels();

      document.getElementById('saveSubmitBtn').textContent = '変更を保存する';
      document.getElementById('formDeleteBtn').style.display = 'block';

      detailPage.classList.remove('active');
      addPage.classList.add('active');
      headerTitle.textContent = '歌詞の編集';
      backBtn.style.display = 'flex';
    });

    document.getElementById('formDeleteBtn').addEventListener('click', () => {
      if (!editingId || !db) return;

      if (confirm('この歌詞を削除してもよろしいですか？')) {
        const tx = db.transaction('lyrics', 'readwrite');
        const store = tx.objectStore('lyrics');
        store.delete(editingId);

        tx.oncomplete = () => {
          resetForm();
          switchToListPage();
        };
      }
    });

    const lyricList = document.getElementById('lyricList');
    const emptyState = document.getElementById('emptyState');

    function renderLyricsList(query = '') {
      if (!db) return;

      const tx = db.transaction('lyrics', 'readonly');
      const store = tx.objectStore('lyrics');
      const req = store.getAll();

      req.onsuccess = () => {
        let lyrics = req.result.sort((a, b) => b.createdAt - a.createdAt);

        if (query.trim() !== '') {
          const q = query.toLowerCase();
          lyrics = lyrics.filter(item => 
            item.songTitle.toLowerCase().includes(q) ||
            item.gameTitle.toLowerCase().includes(q) ||
            item.brandName.toLowerCase().includes(q) ||
            item.artistName.toLowerCase().includes(q) ||
            item.songType.toLowerCase().includes(q)
          );
        }

        lyricList.innerHTML = '';

        if (lyrics.length === 0) {
          emptyState.style.display = 'flex';
          lyricList.style.display = 'none';
        } else {
          emptyState.style.display = 'none';
          lyricList.style.display = 'flex';

          lyrics.forEach(item => {
            const card = document.createElement('div');
            card.className = 'lyric-card';

            let metaText = item.gameTitle;
            if (item.brandName) {
              metaText = metaText ? `${metaText} (${item.brandName})` : item.brandName;
            }

            const previewText = item.blocks && item.blocks.length > 0 ? item.blocks[0] : '';

            card.innerHTML = `
              <div class="card-meta">
                <span class="card-game-brand">${metaText || '作品名未設定'}</span>
                <span class="card-badge">${item.songType}</span>
              </div>
              <div class="card-song-title">${item.songTitle}</div>
              <div class="card-artist">${item.artistName || '歌手未設定'}</div>
              ${previewText ? `<div class="card-preview">${previewText}</div>` : ''}
            `;

            card.addEventListener('click', () => {
              openDetailPage(item);
            });

            lyricList.appendChild(card);
          });
        }
      };
    }

    function openDetailPage(item) {
      currentDetailItem = item;

      document.getElementById('detailBadge').textContent = item.songType;
      document.getElementById('detailTitle').textContent = item.songTitle;

      const chipsRow = document.getElementById('detailChipsRow');
      chipsRow.innerHTML = '';

      if (item.artistName) {
        const chip = createChip(item.artistName, '歌手', `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        `);
        chipsRow.appendChild(chip);
      }

      if (item.gameTitle) {
        const chip = createChip(item.gameTitle, '作品', `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4"/><path d="M8 10v4"/><circle cx="15" cy="11" r="1"/><circle cx="18" cy="13" r="1"/></svg>
        `);
        chipsRow.appendChild(chip);
      }

      if (item.brandName) {
        const chip = createChip(item.brandName, 'ブランド', `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        `);
        chipsRow.appendChild(chip);
      }

      const lyricsStage = document.getElementById('lyricsStage');
      lyricsStage.innerHTML = '';

      if (item.blocks && item.blocks.length > 0) {
        item.blocks.forEach(blockText => {
          const p = document.createElement('div');
          p.className = 'lyric-display-block';
          p.textContent = blockText;
          lyricsStage.appendChild(p);
        });
      }

      listPage.classList.remove('active');
      addPage.classList.remove('active');
      detailPage.classList.add('active');

      navListPage.classList.remove('active');
      navAddPage.classList.remove('active');

      backBtn.style.display = 'flex';
      headerTitle.textContent = '歌詞の閲覧';
    }

    function createChip(text, categoryLabel, iconSvg) {
      const chip = document.createElement('div');
      chip.className = 'meta-chip';
      chip.innerHTML = `${iconSvg} <span>${text}</span>`;
      chip.title = `${categoryLabel}: ${text} で検索`;
      chip.addEventListener('click', () => {
        filterByKeyword(text);
      });
      return chip;
    }

    function buildCategoryDrawer() {
      if (!db) return;

      const tx = db.transaction('lyrics', 'readonly');
      const store = tx.objectStore('lyrics');
      const req = store.getAll();

      req.onsuccess = () => {
        const lyrics = req.result;

        const artists = {};
        const games = {};
        const brands = {};
        const types = {};

        lyrics.forEach(item => {
          if (item.artistName) artists[item.artistName] = (artists[item.artistName] || 0) + 1;
          if (item.gameTitle) games[item.gameTitle] = (games[item.gameTitle] || 0) + 1;
          if (item.brandName) brands[item.brandName] = (brands[item.brandName] || 0) + 1;
          if (item.songType) types[item.songType] = (types[item.songType] || 0) + 1;
        });

        renderTagGroup('artistTags', artists);
        renderTagGroup('gameTags', games);
        renderTagGroup('brandTags', brands);
        renderTagGroup('typeTags', types);
      };
    }

    function renderTagGroup(containerId, dataMap) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      const keys = Object.keys(dataMap).sort((a, b) => dataMap[b] - dataMap[a]);
      if (keys.length === 0) {
        container.innerHTML = '<span style="font-size:0.75rem; color:var(--text-sub);">登録なし</span>';
        return;
      }

      keys.forEach(key => {
        const tag = document.createElement('div');
        tag.className = 'category-tag';
        tag.innerHTML = `<span>${key}</span> <span class="tag-count">${dataMap[key]}</span>`;
        tag.addEventListener('click', () => {
          drawerOverlay.classList.remove('active');
          filterByKeyword(key);
        });
        container.appendChild(tag);
      });
    }

    // JSON書き出し
    document.getElementById('exportBtn').addEventListener('click', () => {
      if (!db) return;
      const tx = db.transaction('lyrics', 'readonly');
      const store = tx.objectStore('lyrics');
      const req = store.getAll();

      req.onsuccess = () => {
        const dataStr = JSON.stringify(req.result, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `lyric_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };
    });

    // JSON読み込み
    const importBtn = document.getElementById('importBtn');
    const importFileInput = document.getElementById('importFileInput');

    importBtn.addEventListener('click', () => {
      importFileInput.click();
    });

    importFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file || !db) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const lyrics = JSON.parse(event.target.result);
          if (!Array.isArray(lyrics)) {
            alert('正しいバックアップファイルではありません。');
            return;
          }

          if (confirm(`${lyrics.length}件の歌詞データを読み込みます。よろしいですか？`)) {
            const tx = db.transaction('lyrics', 'readwrite');
            const store = tx.objectStore('lyrics');

            lyrics.forEach(item => {
              delete item.id;
              store.add(item);
            });

            tx.oncomplete = () => {
              alert('データの取り込みが完了いたしましたわ！');
              drawerOverlay.classList.remove('active');
              switchToListPage();
            };
          }
        } catch (err) {
          alert('ファイルの読み込みに失敗いたしました。JSON形式をご確認ください。');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    searchInput.addEventListener('input', (e) => {
      renderLyricsList(e.target.value);
    });

    // PWA Service Worker 登録処理
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('ServiceWorker 登録成功:', reg.scope))
          .catch((err) => console.log('ServiceWorker 登録失敗:', err));
      });
    }
  </script>

</body>
</html>
